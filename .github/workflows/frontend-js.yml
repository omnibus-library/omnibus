name: Frontend JS

# Lint, typecheck, test and build the React client (frontend-js/) and its Ladle
# stories. Mirrors ts-lint.yml: path gating lives in the `changes` job rather
# than a workflow-level `paths:` filter, so the gate job always reports a status.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            js:
              - "frontend-js/**"
              - ".github/workflows/frontend-js.yml"
              - "flake.nix"
              - "flake.lock"

  frontend-js:
    name: biome + tsc + vitest + stories + build
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # See rust.yml: id-token for the Nix installer's FlakeHub OIDC auth,
      # actions:write for cache-nix-action's `purge: true` self-eviction.
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Its own prefix so this and the other workflows don't evict each other.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-fejs-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-fejs-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-fejs-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 2G

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend-js/node_modules
          key: frontend-js-node-modules-${{ runner.os }}-${{ hashFiles('frontend-js/pnpm-lock.yaml') }}
          restore-keys: |
            frontend-js-node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop .#web --command pnpm --dir frontend-js install --frozen-lockfile

      - name: Biome
        run: nix develop .#web --command pnpm --dir frontend-js exec biome check .

      - name: Typecheck
        run: nix develop .#web --command pnpm --dir frontend-js exec tsc --noEmit

      # Unit tests, the shared components' tests, every page that renders
      # without the API, and a smoke render of every story.
      - name: Unit and component tests
        run: >-
          nix develop .#web --command pnpm --dir frontend-js exec vitest run
          --reporter=default --reporter=junit --outputFile.junit=results.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('frontend-js/results.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: frontend-js/results.xml
          report_type: test_results
          flags: frontend-js
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build the stories
        run: nix develop .#web --command pnpm --dir frontend-js exec ladle build

      - name: Build the app
        run: nix develop .#web --command pnpm --dir frontend-js exec vite build

  # Green when `frontend-js` passed or was skipped, red when it failed. Require
  # only this job in branch protection, never `frontend-js` itself.
  frontend-js-required:
    name: 🔒 Frontend JS Required
    needs: [changes, frontend-js]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: seamus-sloan/gh-actions/ci-gate@ci-gate-v1
        with:
          needs: ${{ toJSON(needs) }}
