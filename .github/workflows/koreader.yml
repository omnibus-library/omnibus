# The KOReader E2E lane: a real KOReader in Docker browsing, searching,
# downloading and opening over OPDS, and syncing shelves through the Omnibus
# plugin, against a freshly seeded scratch server (docs/koreader.md).
#
# No workflow-level paths: (same reasoning as rust.yml); the changes job gates the lane.
name: KOReader

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Nightly on the default branch (main).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: koreader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this PR touches anything that can change the lane: the OPDS/auth
  # server code it exercises, the KOReader image/driver/runner/report, or the
  # shared scratch-server helpers. Only consulted on pull_request events.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      koreader: ${{ steps.filter.outputs.koreader }}
    steps:
      # Gated to PRs: a scheduled run has no PR base to diff against.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            koreader:
              - "server/src/backend/opds/**"
              - "server/src/auth/**"
              - "server/src/backend/ebooks.rs"
              - "server/src/backend/koreader/**"
              - "server/src/backend/kobo_devices.rs"
              - "server/src/backend/kobo/resources.rs"
              - "server/src/backend/overrides.rs"
              - "db/src/epub_rewrite/**"
              - "db/src/metadata_overrides/**"
              - "db/src/kobo.rs"
              - "db/src/koreader_position/**"
              - "db/src/kobo_position/**"
              - "db/src/progress/**"
              - "db/src/read_status/**"
              - "db/src/kobo_devices*"
              - "koreader/**"
              - "ui_tests/koreader/**"
              - "test_data/epubs/generated/alpha.epub"
              - "test_data/epubs/generated/beta.epub"
              - "test_data/epubs/generated/standalone-lagoon.epub"
              - "test_data/epubs/generated/frontmatter-relay.epub"
              - "scripts/koreader-e2e.sh"
              - "scripts/koreader_report.py"
              - "scripts/lib/scratch-server.sh"
              - "scripts/lib/dev-port.sh"
              - ".github/workflows/koreader.yml"

  koreader:
    name: koreader
    needs: changes
    if: ${{ needs.changes.outputs.koreader == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      CARGO_TARGET_DIR: ./target
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Distinct cache from rust.yml/e2e.yml (`nix-rust-`/`nix-e2e-`) so the
      # workflows don't clobber each other; shared across runs via the prefix.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-koreader-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-koreader-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-koreader-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      # Same `shared-key` as rust.yml/e2e.yml so a warm `cargo` target dir
      # primes this lane's debug `dx bundle`.
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: omnibus

      - name: Unit-test the plugin
        run: nix develop .#web --command just koreader-plugin-test

      - name: Run the KOReader lane
        run: nix develop .#web --command scripts/koreader-e2e.sh

      # The kept scratch dir: result JSON, screenshot, KOReader log, server.log.
      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: koreader-lane
          path: /tmp/omnibus-koreader.*/
          retention-days: 7

  # The required status check for this workflow. Always runs (no paths filter +
  # `if: always()`), so branch protection gets a resolved status on every PR —
  # green when koreader passed or was skipped, red when it failed.
  koreader-required:
    name: 🔒 KOReader Required
    needs: [changes, koreader]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: seamus-sloan/gh-actions/ci-gate@ci-gate-v1
        with:
          needs: ${{ toJSON(needs) }}
