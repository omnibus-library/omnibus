# Runs the script suites: the TestFlight scripts', the module map's
# (`just modules`), the KOReader lane report's, scratch-server.sh's
# scratch-dir regression test, and `just koreader`'s preflight checks and home linking.
#
# The TestFlight scripts only ever execute against Apple's live API — one
# during a release dispatch, one on a daily schedule — so a regression is
# invisible until the moment it matters, and the failure modes they guard (a
# build that uploads but reaches no tester; feedback filed twice) look
# exactly like success. The suites stub HTTP and need no App Store Connect
# credentials, so they can gate every change to the scripts here instead.
#
# Deliberately scoped to these suites rather than all of scripts/tests/: the
# dev-port/dev-serve/with-dev-env bash tests expect a Nix dev shell and a
# worktree layout that this runner does not have. The scratch-server one is
# plain bash with stubbed I/O, so it runs here.
name: Script tests

# Path lists are spelled out twice because GitHub Actions does not support YAML
# anchors — keep the two in step.
on:
  push:
    branches: [main]
    paths:
      - "scripts/testflight_distribute.py"
      - "scripts/testflight_feedback_to_issues.py"
      - "scripts/tests/testflight-distribute.test.py"
      - "scripts/tests/testflight-feedback.test.py"
      - "scripts/module_map.py"
      - "scripts/tests/module-map.test.py"
      - "scripts/koreader_report.py"
      - "scripts/tests/koreader-report.test.py"
      - "scripts/lib/dev-port.sh"
      - "scripts/lib/scratch-server.sh"
      - "scripts/tests/scratch-server-make-scratch-dir.test.sh"
      - "scripts/koreader-dev.sh"
      - "scripts/koreader_home.py"
      - "scripts/tests/koreader-home.test.py"
      - "scripts/tests/koreader-dev-preflight.test.sh"
      - "ui_tests/koreader/koreader.sha256"
      - ".github/workflows/script-tests.yml"
  pull_request:
    paths:
      - "scripts/testflight_distribute.py"
      - "scripts/testflight_feedback_to_issues.py"
      - "scripts/tests/testflight-distribute.test.py"
      - "scripts/tests/testflight-feedback.test.py"
      - "scripts/module_map.py"
      - "scripts/tests/module-map.test.py"
      - "scripts/koreader_report.py"
      - "scripts/tests/koreader-report.test.py"
      - "scripts/lib/dev-port.sh"
      - "scripts/lib/scratch-server.sh"
      - "scripts/tests/scratch-server-make-scratch-dir.test.sh"
      - "scripts/koreader-dev.sh"
      - "scripts/koreader_home.py"
      - "scripts/tests/koreader-home.test.py"
      - "scripts/tests/koreader-dev-preflight.test.sh"
      - "ui_tests/koreader/koreader.sha256"
      - ".github/workflows/script-tests.yml"

permissions:
  contents: read

jobs:
  testflight-distribute:
    name: testflight_distribute.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same two the distribute job installs — the suite imports the real
      # script, which imports them at module scope.
      - name: Install deps
        run: python -m pip install --quiet "pyjwt[crypto]" requests

      - name: Run suite
        run: python scripts/tests/testflight-distribute.test.py

  testflight-feedback:
    name: testflight_feedback_to_issues.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --quiet "pyjwt[crypto]" requests

      - name: Run suite
        run: python scripts/tests/testflight-feedback.test.py

  module-map:
    name: module_map.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run suite
        run: python scripts/tests/module-map.test.py

  koreader-report:
    name: koreader_report.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run suite
        run: python scripts/tests/koreader-report.test.py

  scratch-server:
    name: scratch-server.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run suite
        run: bash scripts/tests/scratch-server-make-scratch-dir.test.sh

  koreader-dev:
    name: koreader-dev.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run suite
        run: bash scripts/tests/koreader-dev-preflight.test.sh

  koreader-home:
    name: koreader_home.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run suite
        run: python scripts/tests/koreader-home.test.py
