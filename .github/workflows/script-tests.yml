# Runs the TestFlight scripts' test suites.
#
# Those scripts only ever execute against Apple's live API — one during a
# release dispatch, one on a daily schedule — so a regression is invisible
# until the moment it matters, and the failure modes they guard (a build that
# uploads but reaches no tester; feedback filed twice) look exactly like
# success. The suites stub HTTP and need no App Store Connect credentials, so
# they can gate every change to the scripts here instead.
#
# Deliberately scoped to this one suite rather than all of scripts/tests/: the
# sibling bash tests expect a Nix dev shell and a worktree layout that this
# runner does not have.
name: Script tests

# Path lists are spelled out twice because GitHub Actions does not support YAML
# anchors — keep the two in step.
on:
  push:
    branches: [main]
    paths:
      - "scripts/testflight_distribute.py"
      - "scripts/testflight_feedback_to_issues.py"
      - "scripts/tests/testflight-distribute.test.py"
      - "scripts/tests/testflight-feedback.test.py"
      - ".github/workflows/script-tests.yml"
  pull_request:
    paths:
      - "scripts/testflight_distribute.py"
      - "scripts/testflight_feedback_to_issues.py"
      - "scripts/tests/testflight-distribute.test.py"
      - "scripts/tests/testflight-feedback.test.py"
      - ".github/workflows/script-tests.yml"

permissions:
  contents: read

jobs:
  testflight-distribute:
    name: testflight_distribute.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same two the distribute job installs — the suite imports the real
      # script, which imports them at module scope.
      - name: Install deps
        run: python -m pip install --quiet "pyjwt[crypto]" requests

      - name: Run suite
        run: python scripts/tests/testflight-distribute.test.py

  testflight-feedback:
    name: testflight_feedback_to_issues.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --quiet "pyjwt[crypto]" requests

      - name: Run suite
        run: python scripts/tests/testflight-feedback.test.py
