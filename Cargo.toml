[workspace]
members = ["server", "shared", "db", "mcp", "mock-kobo"]
# `mcp` is out of default-members — it is a standalone client binary that daily
# server work never needs to compile; build it explicitly with
# `cargo build -p omnibus-mcp`. `mock-kobo` (a fake Kobo for sync tests) is
# out for the same reason.
default-members = ["server", "shared"]
resolver = "2"

# Inherited package metadata. Members opt in with `<field>.workspace = true`
# in their own `[package]` block. The `license` field is what flips
# `cargo deny check licenses` from "unlicensed" to MIT for every workspace
# crate — see LICENSE at the repo root and the `licenses` check in
# `.github/workflows/rust.yml`.
[workspace.package]
license = "MIT"

# Centralized dependency versions shared across crates. Crates pull these in
# via `<dep>.workspace = true` (or `{ workspace = true, features = [...] }`
# when they need extra features beyond the workspace baseline). Only deps
# that appear in 2+ crates at the same version are centralized here — single-
# crate deps stay in their own Cargo.toml, and framework-specific deps with
# divergent features (sqlx, axum) are intentionally left per-crate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Declared with no features at the workspace level; consumers opt into the
# features they need (`macros`, `rt-multi-thread`, `sync`, `time`).
tokio = { version = "1", default-features = false }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
