[workspace]
members = ["server", "mobile", "shared", "frontend", "db", "mcp"]
# Exclude `mobile` from default workspace-wide commands (`cargo build`,
# `cargo clippy`, etc.) to avoid unifying the mutually exclusive
# `omnibus-frontend` feature flags (`web` + `mobile`). Build mobile
# explicitly with `cargo build -p omnibus-mobile`. `mcp` is likewise
# out of default-members — it is a standalone client binary that daily
# server work never needs to compile; build it explicitly with
# `cargo build -p omnibus-mcp`.
default-members = ["server", "shared", "frontend"]
resolver = "2"

# Inherited package metadata. Members opt in with `<field>.workspace = true`
# in their own `[package]` block. The `license` field is what flips
# `cargo deny check licenses` from "unlicensed" to MIT for every workspace
# crate — see LICENSE at the repo root and the `licenses` check in
# `.github/workflows/rust.yml`.
[workspace.package]
license = "MIT"

# Centralized dependency versions shared across crates. Crates pull these in
# via `<dep>.workspace = true` (or `{ workspace = true, features = [...] }`
# when they need extra features beyond the workspace baseline). Only deps
# that appear in 2+ crates at the same version are centralized here — single-
# crate deps stay in their own Cargo.toml, and framework-specific deps with
# divergent features (sqlx, axum) are intentionally left per-crate. Dioxus is
# the exception: its version must move in lockstep with the `dx` CLI, so it
# lives here and each crate adds its own features on top.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Declared with no features at the workspace level — `default-features = false`
# is preserved so the frontend WASM build doesn't accidentally pull the
# multi-thread runtime in. Consumers opt into the features they need
# (`macros`, `rt-multi-thread`, `sync`, `time`).
tokio = { version = "1", default-features = false }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"

# Exact (`=`) pins, not `0.7`: `dx` flags any `dioxus` version other than its
# own as incompatible, and the CLI comes from flake.nix (and the Dockerfile's
# `cargo binstall`), so bump these with it. Only Cargo.lock holds the rest of
# the dioxus-* family at the same version — a bare `cargo update` moves them on.
dioxus = "=0.7.9"
dioxus-html = "=0.7.9"
dioxus-router = "=0.7.9"

# `dx` builds the WASM client under these profiles. Declaring one replaces the
# profile dx would otherwise inject, so each states its whole intent.
#
# DWARF was ~88% of the dev bundle and tripled wasm-bindgen's time on every
# rebuild; nothing here reads it.
[profile.wasm-dev]
inherits = "dev"
debug = false

# "z" rather than dx's default "s": ~10% less to download after brotli, and
# ~20% together with `--debug-symbols=false` on every `dx bundle` and the
# wasm-opt level in Dioxus.toml.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
