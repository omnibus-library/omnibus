# A fake Kobo e-reader that speaks the firmware's side of `/kobo/<token>/v1/*`.
# Dev tooling only, out of default-members like `mcp/`. It takes no `omnibus-*`
# dependency on purpose: a type shared with the server can't catch its drift.

[package]
name = "omnibus-mock-kobo"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "mock-kobo"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1", optional = true }
# The control API. Same version as `server/`'s axum so cargo unifies on one build.
axum = { version = "0.8", optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"], optional = true }
# A random hardware id for a device with no state file yet.
uuid = { version = "1", features = ["v4"], optional = true }

[features]
default = ["cli"]
# The `mock-kobo` binary and everything only it needs: the state file,
# settings and control API. The server's device tests take the library
# without it (`default-features = false`).
cli = ["dep:anyhow", "dep:axum", "dep:tokio", "dep:uuid"]

[dev-dependencies]
# Stub Omnibus instances for the firmware tests. Same version as `server/`'s
# axum so cargo unifies on one build.
axum = "0.8"
# Real state files for the store tests, deleted on drop.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
