# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Schema version 2 (required for cargo-deny >= 0.14).
#
# Run locally:  cargo deny check
# CI:           rust.yml `security` job, `cargo deny check` step.

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
# Deny known vulnerabilities and unmaintained crates. Advisories that are
# accepted (e.g. disputed, only affects an unused feature) can be silenced
# with an `ignore` entry below alongside a comment explaining the rationale.
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny's own default for "unsound" (informational) advisories is
# `Scope::Workspace` — it only evaluates them against our own workspace
# crates, never their transitive dependencies. `unmaintained` already
# defaults to `Scope::All`; without this override every `informational =
# "unsound"` advisory below (glib, rand, lru) is silently never matched
# against anything, so its `ignore` entry perpetually warns
# `advisory-not-detected` regardless of whether the crate/version is
# actually present. Verified via `cargo deny -L debug check advisories`:
# with the default Workspace scope none of the three even get a
# match/ignore trace; with `unsound = "all"` all three resolve and are
# correctly suppressed by their `ignore` entries below (issue #2054).
unsound = "all"
# Yanked crates surface as warnings, not errors. Currently accepted:
# `spin 0.9.8` (yanked, no advisory) — transitive via `flume` (sqlx-sqlite)
# and `multer` (axum); collapses when either upstream drops it. See
# docs/dependency-audit.md § Yanked crates.
yanked = "warn"
# "sound" = no known exploitable vulnerability; "best-effort" also pulls in
# unmaintained / notice advisories.
ignore = [
    # ---- rsa "Marvin Attack" timing sidechannel (RUSTSEC-2023-0071) is
    # deliberately NOT listed here, unlike every other entry in this block.
    # `rsa` enters Cargo.lock only via `sqlx-mysql` (this project uses sqlx
    # with the sqlite backend only), and unlike the informational advisories
    # above, "vulnerability"-category advisories have no configurable scope
    # to relax — the gap here is cargo-deny's own crate-graph resolution,
    # which prunes `rsa` as genuinely unreachable for any built target
    # (`cargo deny -L debug check advisories` logs `filtered rsa 0.9.10`;
    # confirmed independently with `cargo tree -i rsa --target all`, which
    # is empty even with `--workspace`). An `ignore` entry here can never
    # match, so it would sit as permanent `advisory-not-detected` noise. The
    # real exemption lives on the `--ignore RUSTSEC-2023-0071` flag on the
    # cargo-audit step in rust.yml, which scans the raw Cargo.lock and does
    # find it. No fixed `rsa` release exists yet — revisit when one ships,
    # and keep the two tools' exemptions in sync until then.

    # ---- Unmaintained (informational) notice for `paste`, a proc-macro
    # helper reached through `lofty` (db's audiobook tag reader). Not a
    # vulnerability: cargo-audit (the blocking gate in rust.yml's `security`
    # job) covers those. Revisit when lofty drops paste.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained — proc-macro via lofty (db audiobook tags); awaiting upstream migration" },

    # ---- Unmaintained notice behind the PDF text extractor (#2568).
    # `ttf-parser` is `lopdf`'s embedded-font parser, reached only through
    # `pdf-extract` in `db::pdf`. Not a vulnerability; and `lopdf 0.42` is the
    # first release past RUSTSEC-2026-0187 (a real stack overflow), so the
    # alternative — pinning back — trades a notice for an abort. Every page
    # it touches runs under `catch_unwind`, behind the parse-size caps.
    # Revisit when lopdf moves to a maintained font parser.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained — transitive via lopdf 0.42 / pdf-extract (db::pdf); lopdf 0.42 is required for RUSTSEC-2026-0187, so a downgrade is worse; awaiting an upstream font-parser migration" },

    # ---- zip `extract()` advisories (SUID/SGID bits, symlink targets, perms
    # applied through symlinks), fixed only in zip >= 9.0.0. `zip 3.0.0` is
    # reachable in the default build via `epub 2.1.5` (the latest epub, which
    # pins `zip = "3.0.0"`); our own db/ and server/ deps are on zip 9.
    # All three hit only `ZipArchive::extract()` / `ZipStreamReader::extract()`,
    # and neither this repo nor epub calls them (archives are read entry by
    # entry, never extracted to disk). Triaged 2026-10-17 (issue #2756).
    # Revisit when epub moves to zip >= 9. Unlike rsa above these entries
    # match, so they are listed here and on the cargo-audit step in rust.yml.
    { id = "RUSTSEC-2026-0367", reason = "zip 3.0.0 extract() SUID/SGID bits, pinned by epub 2.1.5 (fixed in zip >= 9.0.0); only ZipArchive::extract()/ZipStreamReader::extract() are affected and nothing here or in epub calls them" },
    { id = "RUSTSEC-2026-0368", reason = "zip 3.0.0 extract() symlink targets, pinned by epub 2.1.5 (fixed in zip >= 9.0.0); only ZipArchive::extract()/ZipStreamReader::extract() are affected and nothing here or in epub calls them" },
    { id = "RUSTSEC-2026-0369", reason = "zip 3.0.0 extract() permissions applied through symlinks, pinned by epub 2.1.5 (fixed in zip >= 9.0.0); only ZipArchive::extract()/ZipStreamReader::extract() are affected and nothing here or in epub calls them" },

]

# NB: RUSTSEC-2026-0381 (webpki-roots distrusted emSign roots) has no entry
# here for the same reason as rsa above: cargo-deny's graph never reaches
# `webpki-roots 0.26.11`, the semver-trick shim sqlx-core 0.8.6 locks, which
# re-exports the patched webpki-roots 1.0.10. cargo-audit scans the raw
# Cargo.lock and does find it, so its exemption is the `--ignore` on the
# cargo-audit step in rust.yml. sqlx opens SQLite files only and makes no TLS
# connection. Revisit when sqlx moves to webpki-roots 1.

# NB: RUSTSEC-2026-0221 (event-listener unsoundness, reachable via sqlx-core)
# is NOT ignored here — it was fixed for real by bumping event-listener
# 5.4.1 -> 5.4.2 (`cargo update -p event-listener`; patched in >= 5.4.2).
# See Cargo.lock and issue #1681.

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
# Permissive set covering everything currently in the dependency tree.
# Add entries here (never remove) when `cargo deny check licenses` reports
# an unlicensed or denied crate after a dependency bump. Crate-specific
# carve-outs go under `[[licenses.exceptions]]` below so the global allow
# list stays minimal.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Boost Software License — permissive, OSI-approved. Used by `ryu`
    # (`ryu` is `Apache-2.0 OR BSL-1.0`, via serde_json).
    "BSL-1.0",
    # Community Data License Agreement, Permissive 2.0 — Linux Foundation
    # license used by `webpki-roots` (Mozilla CA bundle data). Permissive;
    # any TLS-via-rustls project hits this.
    "CDLA-Permissive-2.0",
    # BSD Zero Clause — public-domain-equivalent, OSI-approved (more permissive
    # than MIT: no attribution required). Used by `quoted_printable` (transitive
    # via `lettre`, the Send-to-Kindle SMTP client).
    "0BSD",
]
# With version = 2 the allow-list above is authoritative: any license not
# listed is denied, and a crate whose license cannot be determined is an
# error. (The pre-v2 `unlicensed` / `copyleft` keys were removed in v2.)

# Per-crate license carve-outs. Prefer this over expanding `allow` when a
# single crate is the only user of an otherwise-undesirable license.
[[licenses.exceptions]]
# `epub` is GPL-3.0, used in `omnibus-db` to parse EPUB metadata. This is a
# direct dependency carried over from before the licenses check was wired up;
# the rest of the workspace is MIT. Scoping the GPL-3.0 acceptance to this one
# crate keeps the policy honest — any other GPL crate sneaking in via a future
# dependency bump still fails the check. Revisit by either porting metadata
# extraction onto a non-GPL EPUB parser or accepting the copyleft posture
# explicitly in LICENSE.
allow = ["GPL-3.0"]
name = "epub"

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
# Duplicates are audited in docs/dependency-audit.md — entries below cover
# the families listed there plus their companion crates (e.g. `rand_core`,
# `foldhash`) that ship in lockstep with the duplicated runtime crate.
# Warn rather than deny so new skew is visible without blocking CI — the
# families below are upstream splits we cannot collapse.
[bans]
multiple-versions = "warn"
# Deny crates that should never appear in the dependency tree.
deny = []

# ---------------------------------------------------------------------------
# Accepted / blocked duplicate families (see docs/dependency-audit.md)
# ---------------------------------------------------------------------------
skip = [
    # --- getrandom + rand_core ---
    # 0.2 intentionally kept for the argon2/rand_core 0.6 auth path in db.
    # 0.3 from jobserver (→ cc, build-dep only). 0.4 runtime via uuid (below).
    # rand_core 0.6/0.9 mirror the argon2 and metrics-util paths.
    # See docs/dependency-audit.md for upgrade trigger conditions.
    { name = "getrandom", version = "0.2.17" },
    { name = "getrandom", version = "0.3.4" },
    # getrandom 0.4 via `uuid 1.x` — a RUNTIME dependency: db::helpers::mint_uuid
    # calls Uuid::new_v4() in non-test code (uuid's `v4` feature → getrandom
    # 0.4), so it DOES link into the shipped server binary. (tempfile 3 is the
    # dev/test path.) Accepted — this is the modern getrandom line and cannot
    # collapse onto the 0.2 auth pin without an argon2 upgrade.
    { name = "getrandom", version = "0.4.2" },
    { name = "rand_core", version = "0.6.4" },
    { name = "rand_core", version = "0.9.5" },

    # --- hashbrown split ---
    # 0.15 from sqlx-core (and its hashlink), 0.16 from metrics-util
    # (axum-prometheus), 0.17 from indexmap. All internal impl details — not in
    # any public API surface.
    { name = "hashbrown", version = "0.15.5" },
    { name = "hashbrown", version = "0.16.1" },
    # foldhash ships one copy per hashbrown minor: 0.1 with hashbrown 0.15,
    # 0.2 with hashbrown 0.16. Both are internal impl details of hashbrown.
    { name = "foldhash", version = "0.1.5" },
    { name = "foldhash", version = "0.2.0" },

    # --- rand 0.9 (metrics) ---
    # From metrics-util (→ metrics-exporter-prometheus → axum-prometheus), beside
    # the workspace's newer rand. Collapses when metrics-util bumps rand.
    { name = "rand", version = "0.9.4" },

    # --- zip (epub's pin vs ours) ---
    # 3.0.0 from `epub` 2.1.5, which asks for `zip = "3.0.0"`; 9.x from
    # omnibus-db/omnibus directly. Collapses when epub moves to zip 9.
    { name = "zip", version = "3.0.0" },

    # --- windows-sys (four-way split, all windows-target-conditional) ---
    # `cargo deny` resolves the crate graph across every target (like
    # `cargo tree --target all`), so these Windows-only (`cfg(windows)`)
    # copies show up even though this project ships Linux/container-only:
    # ring/rustls-webpki, tokio and its socket2/mio, tracing-subscriber,
    # tempfile and rustls-platform-verifier each pin their own.
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-sys", version = "0.59.0" },
    { name = "windows-sys", version = "0.60.2" },
    { name = "windows-sys", version = "0.61.2" },

    # --- webpki-roots ---
    # 0.26 from sqlx-core; 1.0 from hyper-rustls (reqwest).
    # Collapses when sqlx bumps its rustls deps.
    { name = "webpki-roots", version = "0.26.11" },

    # --- tower-http ---
    # 0.6.11 from reqwest 0.13 (which vendors its own copy) beside the server's
    # own pin; persists until reqwest upgrades to tower-http 0.7.
    { name = "tower-http", version = "0.6.11" },
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
# crates.io only. No git source is allowed: a git dependency resolves by SHA,
# which `cargo audit` cannot match against RUSTSEC advisories.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
