# Refuse versions published in the last 14 days (minutes).
minimumReleaseAge: 20160
allowBuilds:
  esbuild: true
  # Only copies the worker script; `msw init .storybook/public` does that here.
  msw: false
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.11.0
  - pnpm@11.11.0
  # Renovate security update: vite@8.3.3
  - vite@8.3.3
  # Renovate security update: @storybook/addon-vitest@10.6.2
  - "@storybook/addon-vitest@10.6.2"
  # Renovate security update: @vitest/browser@5.0.5
  - "@vitest/browser@5.0.5"
  # Renovate security update: storybook@10.6.2
  - storybook@10.6.2
