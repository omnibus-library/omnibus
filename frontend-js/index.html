<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omnibus (React PoC)</title>
    <link rel="icon" type="image/png" href="/src/assets/omnibus-stoat.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <!-- No SSR draws a loader, so this one paints before the bundle runs: the
         markup the signed-in gate's <Loading kind="page"> renders, so the
         hand-off is seamless, styled by the stylesheet the build links above. -->
    <div id="root">
      <div class="atrium">
        <script>
          try {
            // THEME_STORAGE_KEY and THEMES in src/components/Theme/AtriumRoot.tsx.
            var theme = localStorage.getItem("omn.theme");
            if (/^(dark|black|light|sepia)$/.test(theme || ""))
              document.currentScript.parentElement.setAttribute("data-theme", theme);
          } catch {}
        </script>
        <div class="ld ld-page" role="status" aria-live="polite">
          <span class="ld-riffle lg" aria-hidden="true">
            <span class="ld-rf-book">
              <span class="ld-rf-page l"></span>
              <span class="ld-rf-page r"></span>
              <span class="ld-rf-leaf n0" style="--i: 0"><span class="ld-rf-face front"></span><span class="ld-rf-face back"></span></span>
              <span class="ld-rf-leaf n1" style="--i: 1"><span class="ld-rf-face front"></span><span class="ld-rf-face back"></span></span>
              <span class="ld-rf-leaf n2" style="--i: 2"><span class="ld-rf-face front"></span><span class="ld-rf-face back"></span></span>
            </span>
          </span>
          <p class="ld-label">Opening your library</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
