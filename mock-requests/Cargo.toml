# Fake Prowlarr and download clients (qBittorrent, Transmission, SABnzbd, NZBGet)
# for the book-request pipeline, and a fake ntfy for its notifications. Dev tooling
# only, out of default-members like `mock-kobo/`. Unlike mock-kobo it depends on
# `omnibus-db` and `omnibus-shared` on purpose: the server's own clients are the
# contract the fakes are tested against, and the wiring bodies are the shared types.

[package]
name = "omnibus-mock-requests"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "mock-requests"
path = "src/main.rs"

[dependencies]
# `main.rs` is the only user: the library reports typed errors.
anyhow = "1"
# Same version/features `server/` uses, so cargo unifies on one build.
axum = { version = "0.8", features = ["multipart"] }
# Same version `db/` uses to carry NZB bytes, so cargo unifies on one build.
base64 = "0.22"
omnibus-shared = { path = "../shared" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# `test-support` seeds the reader whose request queues a notification for the outbox test.
omnibus-db = { path = "../db", features = ["test-support"] }
# The tests call the control API and upload NZBs directly.
reqwest = { workspace = true, features = ["query", "multipart"] }
tempfile = { workspace = true }
# Reads back the outbox row a drain left, which `omnibus-db` exports no reader for. The
# version `db/` uses and a subset of its features, so cargo unifies on one build.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
